name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build and Test on JDK ${{ matrix.java }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - 'macos-latest'
          - 'ubuntu-latest'
        java:
          - '17'
          - '21'

    steps:
      # sonarcloud-ignore githubactions:S7637
      - uses: actions/checkout@v7
      # sonarcloud-ignore githubactions:S7637
      - uses: actions/setup-node@v6
      - name: Set up JDK ${{ matrix.java }}
        # sonarcloud-ignore githubactions:S7637
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Build (includes tests) and create shaded JAR
        run: mvn -B -ntp clean verify

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'target/*/TEST-*.xml'

  shell-tests:
    name: Shell tests (BATS) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - 'macos-latest'
          - 'ubuntu-latest'

    steps:
      # sonarcloud-ignore githubactions:S7637
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bats jq

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq

      - name: Run BATS tests
        run: bats --tap src/test/bats/liquibase-runner.bats

      - name: Publish BATS TAP report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '*.tap'
          check_name: 'BATS Test Report (${{ matrix.os }})'

  compatibility:
    name: Liquibase ${{ matrix.liquibase-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        liquibase-version:
          - '4.27.0'
          - '4.33.0'
          - '5.0.0'

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: test
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 10s
          --health-retries 10

    steps:
      # sonarcloud-ignore githubactions:S7637
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        # sonarcloud-ignore githubactions:S7637
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run compatibility tests (Liquibase ${{ matrix.liquibase-version }})
        run: mvn -B -ntp verify -Dliquibase.version=${{ matrix.liquibase-version }}
        env:
          PG_URL: jdbc:postgresql://localhost:5432/testdb
          PG_USER: postgres
          PG_PASS: test
          MYSQL_URL: jdbc:mysql://localhost:3306/testdb?allowPublicKeyRetrieval=true&useSSL=false
          MYSQL_USER: root
          MYSQL_PASS: test
          ORACLE_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          ORACLE_USER: system
          ORACLE_PASS: test

      - name: Assemble LIQUIBASE_HOME (Liquibase ${{ matrix.liquibase-version }})
        run: |
          mkdir -p liquibase-home/lib
          mvn -f .github/liq-compat-deps.xml -B -ntp dependency:copy-dependencies \
            -Dliquibase.compat.version=${{ matrix.liquibase-version }} \
            -DoutputDirectory=${{ github.workspace }}/liquibase-home/lib
          echo "=== JARs assembled in LIQUIBASE_HOME ==="
          ls liquibase-home/lib/

      - name: Test shell wrapper (Liquibase ${{ matrix.liquibase-version }})
        run: |
          RUNNER_JAR="${{ github.workspace }}/target/liquibase-runner.jar"
          CHANGELOG_SRC="${{ github.workspace }}/src/test/resources/db/changelog.xml"
          WRAPPER="${{ github.workspace }}/.bin/liquibase-runner.sh"
          export LIQUIBASE_HOME="${{ github.workspace }}/liquibase-home"

          echo "=== Runner JAR ===" && ls -lh "$RUNNER_JAR"

          run_wrapper_test() {
            local label="$1" url="$2" username="$3" password="$4"
            local test_dir
            test_dir="$(mktemp -d)"
            cp "$CHANGELOG_SRC" "$test_dir/changelog.xml"
            printf 'url=%s\nusername=%s\npassword=%s\nchangeLogFile=changelog.xml\nsearchPath=%s\n' \
              "$url" "$username" "$password" "$test_dir" > "$test_dir/defaults.properties"

            echo "--- [$label] running shell wrapper ---"
            local jar_exit
            set +e
            "$WRAPPER" "$RUNNER_JAR" "$test_dir/defaults.properties" 2>&1 | tee "$test_dir/output.log"
            jar_exit="${PIPESTATUS[0]}"
            set -e

            if [ "$jar_exit" -ne 0 ]; then
              echo "[$label] FAILED: exit code $jar_exit"
              rm -rf "$test_dir"
              return 1
            fi

            local failed=0
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              if ! echo "$line" | jq . > /dev/null 2>&1; then
                echo "[$label] NOT valid JSON: $line"
                failed=1
              fi
            done < "$test_dir/output.log"

            rm -rf "$test_dir"
            [ "$failed" -eq 0 ] || return 1
            echo "[$label] PASSED"
          }

          run_wrapper_test "H2" \
            "jdbc:h2:mem:shelltest_$(date +%s);DB_CLOSE_DELAY=-1" "sa" ""

          run_wrapper_test "PostgreSQL" \
            "jdbc:postgresql://localhost:5432/testdb" "postgres" "test"

          run_wrapper_test "MySQL" \
            "jdbc:mysql://localhost:3306/testdb?allowPublicKeyRetrieval=true&useSSL=false" "root" "test"

          run_wrapper_test "Oracle" \
            "jdbc:oracle:thin:@//localhost:1521/FREEPDB1" "system" "test"

      - name: Publish Test Report
        # sonarcloud-ignore githubactions:S7637
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          check_name: 'Compatibility Tests (Liquibase ${{ matrix.liquibase-version }})'

  build-results:
    name: Build results
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - build
      - shell-tests
      - compatibility
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
                contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
                || contains(needs.*.result, 'skipped')
                }}
