name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build and Test on JDK ${{ matrix.java }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - "macos-latest"
          - "ubuntu-latest"
        java:
          - "17"
          - "21"

    steps:
      # sonarcloud-ignore githubactions:S7637
      - uses: actions/checkout@v6
      # sonarcloud-ignore githubactions:S7637
      - uses: actions/setup-node@v6
      - name: Set up JDK ${{ matrix.java }}
        # sonarcloud-ignore githubactions:S7637
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Build (includes tests) and create shaded JAR
        run: mvn -B -ntp clean verify

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'target/*/TEST-*.xml'


  shell-tests:
    name: Shell tests (BATS) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - "macos-latest"
          - "ubuntu-latest"

    steps:
      # sonarcloud-ignore githubactions:S7637
      - uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bats jq

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq

      - name: Run BATS tests
        run: bats --tap src/test/bats/liquibase-runner.bats

      - name: Publish BATS TAP report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '*.tap'
          check_name: 'BATS Test Report (${{ matrix.os }})'


  build-results:
    name: Build results
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - build
      - shell-tests
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
                contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
                || contains(needs.*.result, 'skipped')
                }}