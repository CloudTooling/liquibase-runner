name: Compatibility

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  compatibility:
    name: Liquibase ${{ matrix.liquibase-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        liquibase-version:
          - "4.27.0"
          - "4.33.0"
          - "5.0.0"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # sonarcloud-ignore githubactions:S7637
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        # sonarcloud-ignore githubactions:S7637
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run compatibility tests (Liquibase ${{ matrix.liquibase-version }})
        run: mvn -B -ntp verify -Dliquibase.version=${{ matrix.liquibase-version }}
        env:
          PG_URL: jdbc:postgresql://localhost:5432/testdb
          PG_USER: postgres
          PG_PASS: test
          MYSQL_URL: jdbc:mysql://localhost:3306/testdb?allowPublicKeyRetrieval=true&useSSL=false
          MYSQL_USER: root
          MYSQL_PASS: test

      - name: Publish Test Report
        # sonarcloud-ignore githubactions:S7637
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          check_name: "Compatibility Tests (Liquibase ${{ matrix.liquibase-version }})"

  compatibility-results:
    name: Compatibility results
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - compatibility
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
